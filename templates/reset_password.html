{% extends "base.html" %}

{% block title %}Reset Password - Attendance System{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-5 mx-auto">
        <div class="card feature-card">
            <div class="card-header page-card-header">
                <h3><i class="bi bi-shield-lock me-2" aria-hidden="true"></i>Set New Password</h3>
            </div>
            <div class="card-body">
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                {% if valid %}
                <p class="form-text mb-3">Use at least 8 characters with uppercase, lowercase, and a number.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmation" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmation" name="confirmation" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Reset Password</button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
