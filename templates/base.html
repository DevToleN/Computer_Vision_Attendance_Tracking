<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Attendance System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('styling_css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">CV Attendance System</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                <a class="nav-link" href="{{ url_for('register') }}">Register</a>
                <a class="nav-link" href="{{ url_for('attendance') }}">Attendance</a>
                <a class="nav-link" href="{{ url_for('reports') }}">Reports</a>
            </div>
            <div class="navbar-nav ms-auto">
                {% if session.admin_logged_in %}
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    <a class="nav-link" href="{{ url_for('adminregister') }}">Add Admin</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('base_js') }}"></script>
</body>
</html>
