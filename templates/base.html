<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Attendance System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('styling_css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary app-navbar">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}"><span class="brand-mark"><i class="bi bi-person-bounding-box" aria-hidden="true"></i></span>CV Attendance</a>
            <div class="navbar-nav app-nav-links">
                <a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i><span>Home</span></a>
                <a class="nav-link" href="{{ url_for('register') }}"><i class="bi bi-person-plus-fill" aria-hidden="true"></i><span>Register</span></a>
                <a class="nav-link" href="{{ url_for('attendance') }}"><i class="bi bi-camera-video-fill" aria-hidden="true"></i><span>Attendance</span></a>
                <a class="nav-link" href="{{ url_for('reports') }}"><i class="bi bi-bar-chart-fill" aria-hidden="true"></i><span>Reports</span></a>
            </div>
            <div class="navbar-nav ms-auto">
                {% if session.admin_logged_in %}
                    <a class="nav-link" href="{{ url_for('adminregister') }}"><i class="bi bi-person-gear" aria-hidden="true"></i><span>Add Admin</span></a>
                    <a class="nav-link" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Logout</span></a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('login') }}"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i><span>Login</span></a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('base_js') }}"></script>
</body>
</html>
